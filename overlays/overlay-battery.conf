# -------------------------------------------------
# Battery deployment overlay
# Disables UART/Serial to allow cold-boot on battery.
# XIAO nRF54L15 v1.0 hardware limitation: UART active
# at boot prevents startup when powered by battery only.
#
# Use: ./build-xiao.sh --node NDxx --battery
# -------------------------------------------------
CONFIG_SERIAL=n
CONFIG_UART_CONSOLE=n
CONFIG_SHELL=n
CONFIG_OPENTHREAD_SHELL=n
CONFIG_SHELL_BACKEND_SERIAL=n

# RTT als alternatief voor logging via J-Link
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_UART=n
