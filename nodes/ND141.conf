###############################################
# ND141 — combi: 2x MAX31856 + BMP390 luchtdruk
###############################################

###############################################
# Node identity
###############################################
CONFIG_APP_NODE_ID="141"

###############################################
# Measurement cadence
###############################################
CONFIG_APP_MEASUREMENT_PERIOD_S=60

###############################################
# Thread role: FTD (mains, router-capable)
###############################################
CONFIG_OPENTHREAD_FTD=y
CONFIG_OPENTHREAD_MTD=n
CONFIG_OPENTHREAD_JOINER=y

###############################################
# Features
###############################################
CONFIG_APP_INTERVAL_LOCKED=n

###############################################
# Sensors
###############################################
CONFIG_APP_USE_BATT_SENSOR=n
CONFIG_APP_USE_SHT41_SENSOR=n
CONFIG_APP_USE_SCD41_SENSOR=n
CONFIG_APP_USE_SEN50_SENSOR=n
CONFIG_APP_USE_DS18B20_SENSOR=n
CONFIG_APP_USE_MAX31856_SENSOR=y
CONFIG_APP_MAX31856_COUNT=2
CONFIG_APP_USE_BMP390_SENSOR=y
CONFIG_APP_USE_WATERMETER_SENSOR=n

###############################################
# Drivers required by sensors
###############################################
CONFIG_SENSOR=y
# CONFIG_BMP388 NIET verwijderen — dit is ook de driver voor de BMP390
CONFIG_BMP388=y
CONFIG_SPI=y
CONFIG_SPI_BITBANG=y
